name: Rust CI & Android APK Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libsdl2-image-dev aapt zipalign
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build Workspace
        run: cargo build --workspace --verbose --release
      - name: Run Tests
        run: cargo test --workspace --verbose
      - name: Upload Native Executable
        uses: actions/upload-artifact@v4
        with:
          name: callys-client-linux-x86_64
          path: target/release/callys-client
