name: Rust CI & Desktop Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master, fix/prologue-render-layers, fix/active-view-dispatch,
                fix/prologue-boot-order, fix/view-canvas-1136x640, chore/repo-hygiene,
                fix/presentation-gles3, fix/camera-follow, fix/story-runtime-boundaries ]
  workflow_dispatch:

concurrency:
  # A superseding push to the same PR ref cancels the stale run (its result is
  # superseded anyway); pushes to main always run to completion so main keeps
  # a green record per commit.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect change scope
        uses: dorny/paths-filter@v3
        id: scope
        with:
          # contracts/*.json are consumed by tests and CI python scripts, so
          # they count as code; other reconstruction/ files are docs.
          filters: |
            code:
              - 'crates/**'
              - 'android-build/**'
              - 'assets/**'
              - 'scripts/**'
              - 'reconstruction/contracts/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/**'
      - name: Docs-only change
        if: steps.scope.outputs.code != 'true'
        run: echo "docs-only change, Rust build/test skipped by the scope filter" >> "$GITHUB_STEP_SUMMARY"
      - name: Install dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/*chrome*
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libsdl2-image-dev aapt zipalign
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo artifacts
        if: steps.scope.outputs.code == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          # Caches ./target (both the release builds and the ci-test test
          # profile live there) + the cargo registry, keyed on the lockfile and
          # toolchain. Save even on failed runs so a red iteration is fast.
          cache-on-failure: true
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Build Workspace
        if: steps.scope.outputs.code == 'true'
        run: cargo build --workspace --verbose --release
      - name: Build Desktop Client
        if: steps.scope.outputs.code == 'true'
        run: cargo build -p callys-client --features desktop --verbose --release
      - name: Test physical pointer release queue
        run: python3 scripts/test_pointer_release_java.py
      - name: Test the semantic-coverage census
        run: python3 scripts/test_reverse_semantic_coverage.py
      - name: "Differential: Java pointer adapters vs the Rust input semantics"
        run: python3 scripts/test_pointer_mapping_parity.py
      # cargo runs test binaries strictly sequentially; nextest runs one
      # process per binary in parallel across the runner's CPUs. No doctests
      # exist in the tree (zero ``` blocks), so nextest's default doctest skip
      # loses no coverage.
      #
      # The ci-test profile (workspace Cargo.toml) keeps dev's debug-assertions
      # + overflow checks but optimizes codegen: the IR room simulations that
      # dominate this leg are an order of magnitude slower unoptimized (see PR).
      - name: Run Tests
        if: steps.scope.outputs.code == 'true'
        run: cargo nextest run --workspace --cargo-profile ci-test
      - name: Upload Native Executable
        if: steps.scope.outputs.code == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: callys-client-linux-x86_64
          path: target/release/callys-client
