name: Rust CI & Desktop Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master, fix/prologue-render-layers, fix/active-view-dispatch,
                fix/prologue-boot-order, fix/view-canvas-1136x640, chore/repo-hygiene,
                fix/presentation-gles3, fix/camera-follow, fix/story-runtime-boundaries,
                'perf/**', exec-ledger-140, test/reach-last-five,
                test/boss-alarm-ladders, test/ending-ladders,
                test/undead-house-ladders, test/enemy-ladders-ii,
                test/enemy-ladders-iii, test/specials-ladders,
                test/final-sweep, test/last-two-bodies,
                feat/full-playthrough,
                test/map-round-trip ]
  workflow_dispatch:

concurrency:
  # A superseding push to the same PR ref cancels the stale run (its result is
  # superseded anyway); pushes to main always run to completion so main keeps
  # a green record per commit.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The test suite is sharded with nextest's round-robin count partition
        # (per-binary, so the heavy room simulations spread across shards); the
        # union of the shards still runs every test exactly once.
        shard: [1, 2, 3, 4]
    env:
      # sccache with the GitHub Actions cache backend: caches rustc compiles
      # (workspace rlibs included) across runs; links are not cacheable and
      # still execute per shard.
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    steps:
      - uses: actions/checkout@v4
      - name: Detect change scope
        uses: dorny/paths-filter@v3
        id: scope
        with:
          # contracts/*.json are consumed by tests and CI python scripts, so
          # they count as code; other reconstruction/ files are docs.
          # .cargo/** is code: it carries the host link-step rustflags that the
          # test leg depends on (see ci-mold-linker contract).
          filters: |
            code:
              - 'crates/**'
              - 'android-build/**'
              - 'assets/**'
              - 'scripts/**'
              - 'reconstruction/contracts/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/**'
              - '.github/workflows/**'
      - name: Docs-only change
        if: steps.scope.outputs.code != 'true'
        run: echo "docs-only change, Rust build/test skipped by the scope filter" >> "$GITHUB_STEP_SUMMARY"
      - name: Install dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/*chrome*
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libsdl2-image-dev aapt zipalign mold
      - name: Verify the host linker driver resolves mold
        if: steps.scope.outputs.code == 'true'
        run: |
          # The host link step is configured for mold in .cargo/config.toml
          # ([target.x86_64-unknown-linux-gnu] rustflags). Fail here, with the
          # driver's own words, if mold is missing or unresolvable -- otherwise
          # it surfaces later as a confusing linker error inside cargo.
          mold --version
          echo 'int main(void) { return 0; }' > "$RUNNER_TEMP/mold_probe.c"
          cc -fuse-ld=mold "$RUNNER_TEMP/mold_probe.c" -o "$RUNNER_TEMP/mold_probe"
          "$RUNNER_TEMP/mold_probe"
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Set up sccache
        if: steps.scope.outputs.code == 'true'
        uses: mozilla-actions/sccache-action@v0.0.11
      - name: Cache cargo artifacts
        if: steps.scope.outputs.code == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          # add-job-id-key: false shares one cache namespace across all four
          # shards (their target dirs are equivalent); the first saver wins and
          # the rest report up-to-date.
          add-job-id-key: false
          cache-on-failure: true
          # Cache-key note for the mold linker (.cargo/config.toml):
          # rust-cache hashes .cargo/config.toml and the RUST* env vars into
          # cacheKey (add-rust-environment-hash-key defaults to true) but not
          # into restoreKey, so it still restores the previous target dir
          # through restore-keys and the first shard to finish saves the new
          # key. The one-off cost of this change is cargo invalidating its
          # per-unit fingerprints (the rustflags changed), not a lost cache.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Build Workspace
        if: steps.scope.outputs.code == 'true'
        run: cargo build --workspace --verbose --release
      - name: Build Desktop Client
        if: steps.scope.outputs.code == 'true'
        run: cargo build -p callys-client --features desktop --verbose --release
      - name: Test physical pointer release queue
        run: python3 scripts/test_pointer_release_java.py
      - name: Test the semantic-coverage census
        run: python3 scripts/test_reverse_semantic_coverage.py
      - name: "Differential: Java pointer adapters vs the Rust input semantics"
        run: python3 scripts/test_pointer_mapping_parity.py
      # cargo runs test binaries strictly sequentially; nextest runs one
      # process per binary in parallel across the runner's CPUs. No doctests
      # exist in the tree (zero ``` blocks), so nextest's default doctest skip
      # loses no coverage.
      #
      # The ci-test profile (workspace Cargo.toml) keeps dev's debug-assertions
      # + overflow checks at opt-level 3 with line-tables-only debug info; the
      # IR room simulations that dominate this leg are an order of magnitude
      # slower unoptimized (see PR #78 for the measurements).
      - name: Run Tests (shard ${{ matrix.shard }}/4)
        if: steps.scope.outputs.code == 'true'
        run: cargo nextest run --workspace --cargo-profile ci-test --partition count:${{ matrix.shard }}/4
      - name: Prove the test binaries were linked by mold
        if: steps.scope.outputs.code == 'true'
        run: |
          # mold stamps "mold <version> (compatible with GNU ld)" into the
          # linked output, so this observes the linker that actually ran
          # instead of restating the configuration: a silent fallback to bfd
          # or lld (their banners are "GNU ld ..." / "LLD <version>") fails
          # here. Every shard builds all 168 test binaries, asset included.
          bin=$(find target/ci-test/deps -maxdepth 1 -type f \
                  -name 'font_chunk-*' ! -name '*.d' | head -1)
          test -n "$bin" || { echo "no font_chunk test binary built" >&2; exit 1; }
          if ! grep -a -qE 'mold [0-9]+\.[0-9]+.*compatible with GNU ld' "$bin"; then
            echo "$bin carries no mold banner; it was linked by something else:" >&2
            grep -a -oE 'LLD [0-9.]+|GNU ld \([^)]*\)[0-9. ]*' "$bin" | sort -u | head -3 >&2
            exit 1
          fi
          echo "linked by: $(grep -a -oE 'mold [0-9.]+ \([^)]*\)' "$bin" | head -1)" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Native Executable
        if: steps.scope.outputs.code == 'true' && matrix.shard == 1
        uses: actions/upload-artifact@v4
        with:
          name: callys-client-linux-x86_64
          path: target/release/callys-client
