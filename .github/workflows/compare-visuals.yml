name: Visual Parity Lab

# Screenshot comparison of the Rust remake vs the original Yoyo-runner APK
# on an x86_64 emulator with libndk ARM translation. Produces a per-screen
# colorful-pixel ratio table + screenshots as artifacts, so "the remake has
# content differences" becomes a measurable, reproducible diff instead of
# one-off on-device screenshots.

on:
  workflow_dispatch:
    inputs:
      runs:
        description: 'How many scripted input steps to run per app'
        required: false
        default: '12'
      label:
        description: 'Label for this comparison run'
        required: false
        default: 'parity'
  push:
    branches: [fix/prologue-render-layers]
    paths:
      - '.github/workflows/compare-visuals.yml'

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Keep the preinstalled SDK (it is what we need)
        run: |
          # Do NOT delete /usr/local/lib/android — the runner's preinstalled
          # SDK is exactly what the emulator steps use. Free space elsewhere:
          sudo rm -rf /usr/local/share/boost || true
          df -h /

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-pil jq unzip
          pip3 install --user Pillow

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Point the environment at the preinstalled SDK
        run: |
          ls /usr/local/lib/android/sdk
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"

      - name: Create AVD (API 30, x86_64, libndk ARM translation)
        run: |
          # API 30 x86_64 image ships with libndk translation for armeabi-v7a.
          # The original Yoyo APK is armeabi-v7a-only; the remake is arm64-v8a.
          SDKMGR=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          AVDMGR=$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager
          ls "$ANDROID_HOME/cmdline-tools/"
          "$SDKMGR" --install "system-images;android-30;google_apis;x86_64" > /dev/null
          # Pin the AVD home for BOTH steps: run 36460061865 showed avdmanager
          # exiting 0 while printing no "Created AVD" line, and the emulator then
          # died on "Unknown AVD name [lab] / no lab.ini in $HOME/.android/avd".
          # Both create and launch now resolve $ANDROID_AVD_HOME — same path —
          # and a missing ini fails the CREATE step with the full truth instead
          # of silently deferring to the boot step's budget.
          export ANDROID_AVD_HOME=$HOME/.android/avd
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_AVD_HOME"
          printf 'no\n' | "$AVDMGR" create avd -n lab -k "system-images;android-30;google_apis;x86_64" -d pixel_5 --force
          if [ ! -f "$ANDROID_AVD_HOME/lab.ini" ]; then
            echo "::error::avdmanager returned 0 but $ANDROID_AVD_HOME/lab.ini is missing"
            echo "--- avdmanager list ---"; "$AVDMGR" list avd || true
            echo "--- \$HOME/.android ---"; ls -laR "$HOME/.android" 2>/dev/null | head -40 || true
            echo "--- stray lab.ini anywhere ---"; find /home /root /tmp -name 'lab.ini' 2>/dev/null | head || true
            exit 1
          fi
          echo "--- created ---"; head -20 "$ANDROID_AVD_HOME/lab.ini"
          "$AVDMGR" list avd | head -20

      - name: Boot emulator (gpu swiftshader_indirect)
        run: |
          # emulator + adb live in the preinstalled SDK, not on PATH by default
          export PATH="$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools:$PATH"
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          # KVM: the image we need (x86_64 + ARM translation) will NOT boot
          # without hardware acceleration. Runner /dev/kvm perms drift
          # (root:kvm 660 vs world-rw); fix them and fail FAST with a visible
          # reason instead of hanging in adb wait-for-device (which blocks
          # forever when no device ever attaches — that ate the whole 60m
          # budget on run 36292998656).
          echo "cpuinfo flags: $(grep -oE 'vmx|svm' /proc/cpuinfo | sort -u | tr '\n' ' ')"
          ls -la /dev/kvm || true
          sudo chmod 666 /dev/kvm 2>/dev/null || true
          ls -la /dev/kvm
          emulator -avd lab -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect -memory 3072 -cores 2 \
            > ${{ github.workspace }}/emulator.log 2>&1 &
          EMU_PID=$!
          # bounded device attach: 5 min, not forever
          if ! timeout 300 adb wait-for-device; then
            echo "::error::adb never saw a device (kvm/emulator launch failure)"
            kill -0 $EMU_PID || echo "emulator process already dead"
            tail -60 ${{ github.workspace }}/emulator.log
            exit 1
          fi
          # bounded boot-completed wait: 8 min
          ok=""
          for i in $(seq 1 96); do
            boot=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            if [ "$boot" = "1" ]; then ok=1; break; fi
            kill -0 $EMU_PID || break
            sleep 5
          done
          if [ -z "$ok" ]; then
            echo "::error::emulator did not boot"
            ps aux | grep -i '[e]mulator' | head -5 || true
            tail -60 ${{ github.workspace }}/emulator.log
            exit 1
          fi
          adb shell input keyevent KEYCODE_WAKEUP
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell wm size 1080x2340 || true

      - name: Fetch original APK
        run: |
          mkdir -p apks
          URL="https://github.com/${{ github.repository }}/releases/download/original-apk-v1/callys_original.apk"
          curl -L --retry 3 -o apks/original.apk "$URL"
          sha256sum apks/original.apk
          [ "$(sha256sum apks/original.apk | cut -d' ' -f1)" = "d608f4557ad66326de36268b9ab062afec839344e57d85afb6220405ea8cd8c9" ] || { echo "original APK hash mismatch"; exit 1; }
          ls -lh apks/original.apk

      - name: Build the remake APK for arm64 on the runner
        run: |
          # Cross-compile the client cdylib for arm64-v8a AND x86_64 with the
          # preinstalled NDK, then assemble the APK with the same steps
          # build_apk.sh does.
          #
          # The x86_64 lib is NOT optional: the AVD is an x86_64 image whose
          # libndk translation only covers armeabi-v7a (32-bit ARM). A
          # lib/arm64-v8a-only APK installs (dexopt isa=x86_64, no native
          # libs match), launches, and dies in System.loadLibrary before any
          # Java exception surfaces (run 36510277516: 'Start proc … 5890' →
          # 'has died: prcp TOP' 1.8s later, screenshots = launcher home).
          export PATH="$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools:$PATH"
          NDK_VER=$(ls "$ANDROID_HOME/ndk/" | sort -V | tail -1)
          echo "using NDK $NDK_VER"
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VER
          rustup target add aarch64-linux-android x86_64-linux-android
          mkdir -p .cargo
          cat > .cargo/config.toml <<'CFG'
          [target.aarch64-linux-android]
          linker = "aarch64-linux-android33-clang"
          [target.x86_64-linux-android]
          linker = "x86_64-linux-android33-clang"
          CFG
          # (no manual -landlog: the NDK has no libandlog.so — rust's android
          # std already links -llog, which IS the android log lib; run fa92e12
          # died on 'unable to find library -landlog' from this hand-added flag)
          export PATH="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          # MUST pass --target: without it cargo builds the HOST (x86_64) lib
          # into target/release/ and the aarch64 tree never appears (run
          # 36461191932 "Finished" in 50s then ls failed — a host build
          # cannot be installed on the arm64 emulator).
          cargo build --release -p callys-client --target aarch64-linux-android
          cargo build --release -p callys-client --target x86_64-linux-android
          ls -lh target/aarch64-linux-android/release/libcallys_client.so
          file target/aarch64-linux-android/release/libcallys_client.so
          ls -lh target/x86_64-linux-android/release/libcallys_client.so
          file target/x86_64-linux-android/release/libcallys_client.so

      - name: Install original APK (arm translation check)
        run: |
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          adb install -r apks/original.apk || adb install -r --abi armeabi-v7a apks/original.apk
          adb shell pm list packages | grep vdogames

      - name: Build remake APK on runner (this exact head)
        run: |
          # Assemble the APK with the same steps build_apk.sh performs, using
          # the arm64 cdylib cross-compiled earlier and the runner's SDK
          # build-tools (aapt2/d8/apksigner). Moved BEFORE the original's
          # scripted run (run 36462655540): the original device-died mid-loop
          # and skipped this step, so we never even got remake screenshots —
          # the remake half of every future comparison must not be hostage
          # to the original's stability.
          BT=$(ls $ANDROID_HOME/build-tools/ | sort -V | tail -1)
          export PATH="$ANDROID_HOME/build-tools/$BT:$PATH"
          export ANDROID_JAR=$ANDROID_HOME/platforms/android-36/android.jar
          cd android-build
          aapt2 compile --dir res -o compiled/res.flat.zip
          aapt2 link -I "$ANDROID_JAR" --manifest AndroidManifest.xml -o base.apk compiled/res.flat.zip
          mkdir -p classes
          javac --release 17 -cp "$ANDROID_JAR" -d classes src/com/gongmi/callyscaves2/*.java
          d8 --lib "$ANDROID_JAR" --release --output . --min-api 24 $(find classes -name '*.class')
          python3 - <<'PY'
          import zipfile, os
          root = os.environ.get("GITHUB_WORKSPACE")
          so = os.path.join(root, "target/aarch64-linux-android/release/libcallys_client.so")
          full_ir = os.path.join(root, "crates/core/src/generated/full_ir.json")
          asset_root = os.path.join(root, "assets")
          with zipfile.ZipFile("base.apk", "a") as z:
              z.write("classes.dex", "classes.dex")
              z.write(so, "lib/arm64-v8a/libcallys_client.so")
              xso = os.path.join(root, "target/x86_64-linux-android/release/libcallys_client.so")
              z.write(xso, "lib/x86_64/libcallys_client.so")
              with open(full_ir, "rb") as f:
                  data = f.read()
              info = zipfile.ZipInfo("assets/full_ir.json", date_time=(2026, 1, 1, 0, 0, 0))
              info.compress_type = zipfile.ZIP_DEFLATED
              info.external_attr = 0o644 << 16
              z.writestr(info, data, compress_type=zipfile.ZIP_DEFLATED, compresslevel=9)
              for r, _, files in os.walk(asset_root):
                  for f in files:
                      full = os.path.join(r, f)
                      rel = os.path.relpath(full, asset_root)
                      ext = os.path.splitext(f)[1].lower()
                      compress = zipfile.ZIP_DEFLATED if ext in (".json", ".txt", ".xml", ".wav", ".droid") else zipfile.ZIP_STORED
                      info = zipfile.ZipInfo(f"assets/{rel}", date_time=(2026, 1, 1, 0, 0, 0))
                      info.compress_type = compress
                      info.external_attr = 0o644 << 16
                      with open(full, "rb") as fh:
                          z.writestr(info, fh.read(), compress_type=compress)
          print("APK assembled")
          PY
          zipalign -p -f 4 base.apk aligned.apk
          # debug signing is fine for emulator install
          keytool -genkeypair -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -validity 9999
          apksigner sign --ks debug.keystore --ks-pass pass:android aligned.apk
          cp aligned.apk CallysCaves2_64bit_Rust.apk
          ls -lh CallysCaves2_64bit_Rust.apk

      - name: Scripted run of the REMAKE
        run: |
          # (remake runs FIRST — see note above)
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          adb uninstall com.gongmi.callyscaves2 || true
          adb install -r android-build/CallysCaves2_64bit_Rust.apk || { echo "APK install failed"; exit 1; }
          nohup adb logcat -v threadtime > remake_logcat.txt 2>&1 &
          LOG_PID=$!
          # -W gives the real component + launch status instead of the
          # optimistic 'Starting: Intent' line (run 36508961487: am start
          # 'succeeded', screenshots showed the LAUNCHER HOME — the process
          # was gone by the first screencap; the RED below proves where/why)
          adb shell am start -W -n com.gongmi.callyscaves2/.MainActivity
          mkdir -p shots/remake
          RUNS=${{ github.event.inputs.runs || '12' }}
          fail=0
          for i in $(seq 1 "$RUNS"); do
            sleep 4
            if [ -z "$(adb shell pidof com.gongmi.callyscaves2 2>/dev/null | tr -d '\r')" ]; then
              echo "remake process not alive at iteration $i"
              fail=$i
              break
            fi
            adb exec-out screencap -p > shots/remake/step${i}.png 2>/tmp/screencap_err || { echo "screencap failed at $i: $(cat /tmp/screencap_err)"; fail=$i; break; }
            adb shell input tap 300 800 || { fail=$i; break; }
            adb shell input tap 610 800 || { fail=$i; break; }
            ls -l shots/remake/step${i}.png | awk '{print "step" $5 " bytes"}'
          done
          kill $LOG_PID || true
          if [ "$fail" != 0 ]; then
            echo "::error::remake loop died at iteration $fail"
            adb devices || true
            ps aux | grep -i '[e]mulator' | head -5 || true
            tail -30 ${{ github.workspace }}/emulator.log || true
            echo '--- callyscaves2 lines from logcat ---'
            grep -aE 'gongmi|callys|AndroidRuntime' remake_logcat.txt | tail -60 || true
            tail -120 remake_logcat.txt || true
            exit 1
          fi

      - name: Scripted run of the ORIGINAL
        # continue-on-error: the original is evidence, not a gate. Its
        # v7a-under-libndk instability must not skip the pixel-diff report
        # and artifacts (which is the whole point of the job). The step
        # still shows RED in the UI when the original dies.
        continue-on-error: true
        run: |
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          # Run 36491995099 forensics (artifact): orig step1.png came back 0
          # bytes and orig_logcat.txt dies at 22:23:54, seconds after the
          # RunnerActivity starts — the v7a-under-libndk original kills the
          # whole AVD, then adb's TCP connection HANGS (no RST), so a bare
          # adb call blocked until the 60m job timeout cancelled everything.
          # Every adb interaction below therefore runs under `timeout`, and
          # a dead qemu is detected immediately instead of paid for 25s/call.
          ATTB='timeout 25'   # hard bound on every adb call
          adb shell pidof com.vdogames.callyscaves2 || true
          # (no -r here: run 36508961487 showed 'logcat: -r requires -f' —
          # the rotation flag silently killed the capture)
          $ATTB adb logcat -s 'libc:F' 'DEBUG:F' 'ActivityManager:W' 'AndroidRuntime:E' > orig_logcat.txt 2>&1 &
          LOG_PID=$!
          $ATTB adb shell am start -W -n com.vdogames.callyscaves2/.RunnerActivity
          mkdir -p shots/orig
          RUNS=${{ github.event.inputs.runs || '12' }}
          fail=0
          for i in $(seq 1 "$RUNS"); do
            sleep 4
            if [ -z "$(adb shell pidof com.vdogames.callyscaves2 2>/dev/null | tr -d '\r')" ]; then
              echo "original process gone before iteration $i"
              fail=$i
              break
            fi
            $ATTB adb exec-out screencap -p > shots/orig/step${i}.png 2>/tmp/screencap_err
            rc=$?
            sz=$(stat -c %s shots/orig/step${i}.png 2>/dev/null || echo 0)
            if [ $rc != 0 ] || [ "$sz" -lt 1000 ]; then
              echo "screencap at $i: rc=$rc size=$sz err=$(cat /tmp/screencap_err)"
              fail=$i
              break
            fi
            $ATTB adb shell input tap 300 800 || { fail=$i; break; }
            $ATTB adb shell input tap 610 800 || { fail=$i; break; }
          done
          kill $LOG_PID || true
          if [ "$fail" != 0 ]; then
            echo "::error::original loop died at iteration $fail — original app destabilizes the AVD under libndk translation"
            $ATTB adb devices || true
            pgrep -af qemu-system | head -3 || echo "no qemu process"
            tail -30 ${{ github.workspace }}/emulator.log || true
            tail -80 orig_logcat.txt || true
            exit 1
          fi
          adb shell am force-stop com.vdogames.callyscaves2 || true

      - name: Pixel-diff report
        run: |
          python3 - <<'EOF'
          import os
          from PIL import Image

          def stats(path):
              img = Image.open(path).convert('RGB')
              w, h = img.size
              small = img.resize((160, 90))
              data = list(small.getdata())
              dark = sum(1 for p in data if sum(p) < 60)
              white = sum(1 for p in data if sum(p) > 700)
              colorful = sum(1 for p in data if max(p) - min(p) > 60)
              return dark, white, colorful, len(data)

          rows = []
          for side in ('orig', 'remake'):
              d = f'shots/{side}'
              if not os.path.isdir(d):
                  continue
              for f in sorted(os.listdir(d)):
                  p = os.path.join(d, f)
                  try:
                      dark, white, colorful, total = stats(p)
                  except Exception as e:
                      rows.append((side, f, -1, -1, -1, -1.0))
                      print(f'{side}/{f}: unreadable ({e})', flush=True)
                      continue
                  rows.append((side, f, dark, white, colorful, colorful / total))

          with open('parity_report.txt', 'w') as out:
              out.write('side     step           dark  white  colorful  ratio\n')
              for side, f, dark, white, colorful, ratio in rows:
                  out.write(f'{side:8s} {f:14s} {dark:5d} {white:6d} {colorful:8d}  {ratio:.4f}\n')
          print(open('parity_report.txt').read())
          EOF

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-parity-${{ github.event.inputs.label || 'parity' }}
          path: |
            shots/
            parity_report.txt
            emulator.log
            orig_logcat.txt
            remake_logcat.txt
