[package]
name = "callys-client"
version = "0.2.0"
edition = "2021"

[lib]
name = "callys_client"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "callys-client"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = []
desktop = ["dep:sdl2"]
android = []
# Headless-harness bridge for the resident-set EGL-recovery measurement
# (contract `gpu-command-backend.md` slice 6): adds the JNI entry points
# `~/cally-work/gmbench/Recspike64.java` drives. Never enabled for the APK or
# CI builds - without it the cdylib exports the production surface only.
harness = []

[dependencies]
callys-asset = { path = "../asset" }
callys-core = { path = "../core" }
image = { version = "0.25.10", default-features = false, features = ["png"] }
sdl2 = { version = "0.37", features = ["image"], optional = true }

[target.'cfg(target_os = "android")'.dependencies]

[dev-dependencies]
tempfile = "3"
