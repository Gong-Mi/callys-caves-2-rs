[workspace]
members = [
    "crates/asset",
    "crates/core",
    "crates/client",
]
resolver = "2"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
byteorder = "1.5"
sdl2 = { version = "0.37", features = ["image"] }

# CI test profile: the room-simulation tests dominate the CI test leg and are
# roughly an order of magnitude slower unoptimized. Optimize codegen while
# keeping dev's debug-assertions + overflow checks, and disable incremental
# (useless on a fresh CI runner, and it only slows compilation down).
[profile.ci-test]
inherits = "dev"
opt-level = 3
debug-assertions = true
overflow-checks = true
incremental = false
